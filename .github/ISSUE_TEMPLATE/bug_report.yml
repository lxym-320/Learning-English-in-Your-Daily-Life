name: Bug report
description: 报告可复现的问题（请勿提交密钥或个人内容）
title: "[Bug] "
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      options: [macOS, Android, Supabase]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用与系统版本
      placeholder: Context Lens 0.2.0-beta / macOS 15.x
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 不要粘贴 API 密钥、邮箱、令牌或真实学习内容。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断信息
      description: macOS 可填写“Context → 诊断当前选词”的结果。
