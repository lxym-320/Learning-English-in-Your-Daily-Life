name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS app
        run: ./macos/ContextLens/build.sh
      - name: Package macOS app
        run: ditto -c -k --sequesterRsrc --keepParent "macos/ContextLens/build/Context Lens.app" Context-Lens-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Context-Lens-macOS-unsigned
          path: Context-Lens-macOS.zip

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Context-Lens-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
